name: Update and deploy dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 09:00 America/New_York, Monday-Friday. GitHub handles DST for the named timezone.
    - cron: "0 9 * * 1-5"
      timezone: "America/New_York"

# Never let two deployments race; queue instead of cancelling a running deploy.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e '.[test]'

      - name: Run tests
        run: python -m pytest -q

      # Last good raw data lets the pipeline fall back to cached GLD/DGS2 (still freshness-checked).
      - name: Restore cached market data
        uses: actions/cache@v6
        with:
          path: data/raw
          key: market-data-${{ github.run_id }}
          restore-keys: market-data-

      - name: Download data, calculate signals, build site
        run: python data_engineering/daily_update.py

      - name: Verify site output
        run: |
          test -f site/index.html
          test -f site/data/gold_allocation.json
          test -f site/data/market.json
          python -c "import json; [json.load(open(f'site/data/{n}.json')) for n in ('gold_allocation', 'market')]"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
