[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "macro-dashboard"
version = "0.1.0"
description = "Multi-asset daily macro signal dashboard"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1,<3",
    "numpy>=1.26,<3",
    "yfinance>=0.2.40",
    "requests>=2.31",
    "pyyaml>=6",
    "pyarrow>=15",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
